<!DOCTYPE html>
<html>
  <head>
    <title></title>

    <style>
      body{
        font-family: Arial;
      }

      .details-button{
        background-color: rgb(0,123, 255);
        color: white;
        padding: 5px 10px;
        margin-right: 10px;
        border: none;
        border-radius: 5px;


      }
      .show{
        margin-left: 10px;
      }

      .input{
        padding: 5px 15px;
        border-radius: 4px;
        border-width: 1px;

      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

  
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
      const container = document.querySelector('.js-container');

      function Final(){

        const [pass, setpass] = React.useState(true)

        function redo(){
          setpass(!pass);

          // console.log('show')
        }

        return (
          <>
          <p>Hello welcome to my website</p>
          <input placeholder ="Email" className = 'input' /> <br /><br />
          <input type = {pass ? 'password' : 'type'} placeholder ="Password" className = 'input' />   
          <button className = 'show' onClick = {redo}>Show</button>
          <br /><br />
          <button className = "details-button">Login</button>
           <button className = "details-button">Sign up</button>

          </>
        )
      }

      ReactDOM.createRoot(container).render(<Final />);
     
    </script>
  </body> 
</html>
